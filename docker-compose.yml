services:
  postgres:
    image: postgres:16
    container_name: corn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corn
    ports:
      - "5432:5432"
    volumes:
      - corn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  corn_pgdata:
