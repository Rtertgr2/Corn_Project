services:
  - type: web
    runtime: node
    name: corn-project
    region: oregon
    plan: free
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: corn-db
          property: connectionString

databases:
  - name: corn-db
    region: oregon
    plan: free
